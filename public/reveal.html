<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1e8"><title>Your piece — PieceByPiece"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reveal.css"></head>
<body class="reveal-body"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>piece<span class="brand-accent">by</span>piece</span></a><span class="reveal-header-note">A LITTLE MOMENT, MADE TOGETHER</span></header>
<main class="reveal-main"><div class="reveal-card"><p class="eyebrow">YOUR INVITATION</p><div id="loading-state" class="reveal-loading">Opening your invitation…</div><section id="welcome-state" hidden><div class="reveal-spark">✳</div><h1 id="welcome-title">You're part of the picture.</h1><p class="welcome-copy" id="welcome-copy">Every piece matters. Yours is waiting.</p><div id="challenge-panel" class="challenge-panel" hidden><p class="challenge-label">YOUR LITTLE CHALLENGE</p><p id="challenge-prompt" class="challenge-prompt"></p><label class="challenge-response-label">Your response (optional)<textarea id="challenge-response" maxlength="500" rows="2" placeholder="Type a short response if your challenge asks for one"></textarea></label><label class="challenge-check"><input id="challenge-complete" type="checkbox"> I've completed the challenge.</label></div><div class="reveal-progress"><div class="progress-label"><span>YOUR REVEALS</span><b id="progress-count">0 / 1</b></div><div class="progress-track"><span id="progress-fill"></span></div></div><div id="confirm-step"><button id="ready-button" class="button button-dark reveal-button">I'm ready to reveal my piece <span>→</span></button></div><div id="reveal-step" hidden><p class="confirm-copy">This is your moment. Ready?</p><button id="reveal-button" class="button button-dark reveal-button">Reveal my piece <span>✳</span></button></div><p id="reveal-status" class="reveal-status" role="status"></p></section>
<section id="piece-state" hidden><p class="eyebrow">YOUR PIECE IS HERE</p><h1>One piece. One part of the story.</h1><div class="piece-frame"><img id="piece-image" alt="Your revealed puzzle piece"></div><p class="piece-number" id="piece-number"></p><p class="milestone-note" id="milestone-note" hidden></p><p class="welcome-copy" id="piece-copy">Your piece has joined the bigger picture.</p><a id="board-link" class="board-link" href="#" hidden>See the shared picture ↗</a><button id="next-piece-button" class="button button-dark reveal-button" hidden>Reveal another piece <span>→</span></button><div id="finished-message" class="finished-message" hidden><h2>The picture is complete!</h2><p id="completion-copy"></p></div></section>
<section id="error-state" hidden><div class="reveal-spark">✳</div><h1 id="error-title">We couldn't open this invitation.</h1><p id="error-copy" class="welcome-copy">Please check the link and try again.</p></section></div><p class="reveal-footer">Every piece tells a story.</p></main>
<script src="reveal.js"></script></body></html>
