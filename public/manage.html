<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1e8"><title>Manage experience — PieceByPiece"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="manage.css"></head>
<body class="manage-body"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>piece<span class="brand-accent">by</span>piece</span></a><a class="back-home" href="organizer.html">← Creator space</a></header><main class="manage-main"><div class="manage-heading"><div><p class="eyebrow">YOUR EXPERIENCE</p><h1 id="experience-title">Manage your picture.</h1><p id="experience-subtitle">Keep track of the people bringing it together.</p></div><div class="manage-heading-actions"><button id="manage-launch-button" class="button button-dark" type="button" hidden>Launch experience ↗</button><a id="manage-board-link" class="manage-board-link" href="#" hidden>Open shared board ↗</a></div></div><div id="manage-loading" class="manage-loading">Loading your experience…</div><div id="manage-content" hidden>
<section class="manage-stats"><div><span>PIECES REVEALED</span><b id="revealed-stat">0 / 0</b></div><div><span>PARTICIPANTS</span><b id="participant-stat">0</b></div><div><span>STATUS</span><b id="status-stat">Draft</b></div></section><div class="manage-progress"><span id="manage-progress-fill"></span></div>
<div class="manage-grid"><section class="manage-panel"><div class="manage-panel-heading"><div><p class="eyebrow">THE PEOPLE</p><h2>Participants</h2></div></div><div id="participant-list" class="participant-list"></div></section>
<section class="manage-panel"><div class="manage-panel-heading"><div><p class="eyebrow">MAKE ROOM FOR MORE</p><h2>Add a participant</h2></div></div><form id="add-participant-form"><label>Participant name<input id="new-participant-name" maxlength="80" required placeholder="Enter their name"></label><label>Assign unrevealed pieces <span class="field-sub">Select one or more pieces to give this person.</span><select id="new-participant-pieces" multiple required size="6"></select></label><button class="button button-dark" type="submit">Create invitation ↗</button><p id="add-participant-status" class="manage-status" role="status"></p></form><div id="new-invitation" class="new-invitation" hidden></div></section><section class="manage-panel"><div class="manage-panel-heading"><div><p class="eyebrow">MANUAL CONTROL</p><h2>Move puzzle pieces</h2></div></div><form id="reassign-form"><label>Give pieces to<select id="reassign-target" required></select></label><label>Select unrevealed pieces<select id="reassign-pieces" multiple required size="6"></select></label><button class="button button-dark" type="submit">Reassign selected pieces</button><p id="reassign-status" class="manage-status" role="status"></p></form></section></div>
<section class="manage-panel settings-panel"><div class="manage-panel-heading"><div><p class="eyebrow">KEEP THE MOMENT ON TRACK</p><h2>Experience settings</h2></div></div><form id="settings-form"><label>Message when the picture is complete<textarea id="manage-completion-message" maxlength="240" rows="3" placeholder="A message for everyone who took part"></textarea></label><label>Experience expiry <span class="field-sub">Leave blank if you don't want the experience to expire automatically.</span><input id="manage-expiry" type="datetime-local"></label><label class="show-names-setting"><input id="manage-show-names" type="checkbox"> Show participant names on the public board <span class="field-sub">Off by default. When enabled, a participant name appears beside their revealed piece.</span></label><button class="button button-dark" type="submit">Save settings</button><p id="settings-status" class="manage-status" role="status"></p></form></section><section class="manage-panel history-panel"><div class="manage-panel-heading"><div><p class="eyebrow">THE STORY SO FAR</p><h2>Activity history</h2></div></div><div id="activity-list" class="activity-list"><p class="empty-drafts">Loading activity…</p></div></section>
</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="manage.js"></script></body></html>
